name: Deploy smoke test

on:
  deployment_status:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      url:
        description: Base URL to test (defaults to the production URL)
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       startsWith(github.event.deployment.environment, 'Production'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE_URL: ${{ inputs.url || vars.PRODUCTION_URL || 'https://v-game-theta.vercel.app' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - id: smoke
        continue-on-error: ${{ github.event_name == 'deployment_status' }}
        run: node frontend/scripts/smoke-deploy.mjs "$BASE_URL"
      - if: steps.smoke.outcome == 'failure'
        run: echo "::warning title=Deploy smoke test::Checks failed against $BASE_URL; see the smoke step log."
